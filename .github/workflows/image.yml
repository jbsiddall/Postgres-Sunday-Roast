name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time, in order, so an older main build never
# replaces the moving tags after a newer one. Pull request runs are replaced.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/jbsiddall/postgres-sunday-roast
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: |
          nix build .#default -o image.tar.gz -L
          echo "VERSION=$(nix eval --raw .#default.imageTag)" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          docker load < image.tar.gz
          docker run -d --name smoke -e POSTGRES_PASSWORD=smoke-only -e POSTGRES_DB=app \
            -v "$PWD/tests/initdb:/docker-entrypoint-initdb.d:ro" "postgres-sunday-roast:$VERSION"
          tests/smoke.sh smoke docker
      - name: Commands
        run: |
          docker run --rm "postgres-sunday-roast:$VERSION" postgres --version
          docker run --rm "postgres-sunday-roast:$VERSION" psql --version
          # A busy client must not hold up a stop: SIGINT is a fast shutdown, so
          # the server exits 0 rather than being killed after the timeout.
          docker exec -d smoke psql -h /run/postgresql -U postgres -c 'select pg_sleep(600)'
          sleep 2
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
      - name: Logs on failure
        if: failure()
        run: docker logs smoke || true
      - name: Size
        run: |
          docker image inspect "postgres-sunday-roast:$VERSION" --format '{{.Size}}' |
            numfmt --to=iec --suffix=B | sed 's/^/Uncompressed image: /' >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          skopeo() { nix shell --inputs-from . nixpkgs#skopeo -c skopeo "$@"; }
          pinned="$VERSION-${GITHUB_SHA::7}"
          tags=("$pinned")
          # A rerun of an older commit publishes only its pinned tag, so it
          # cannot move 18, latest or the minor tag back.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            tags+=("$VERSION" 18 latest)
          fi
          for t in "${tags[@]}"; do
            skopeo copy --dest-creds "$creds" docker-archive:image.tar.gz "docker://$IMAGE:$t"
          done
          digest="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$pinned")"
          echo "Pushed \`$IMAGE:$pinned@$digest\`" >> "$GITHUB_STEP_SUMMARY"
