name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time, in order, so an older main build never
# replaces the moving tags after a newer one. Pull request runs are replaced.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/jbsiddall/postgres-sunday-roast
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: |
          # Run the harness with the bash writeShellApplication gives the entrypoint.
          ENTRYPOINT_BASH="$(nix build --no-link --print-out-paths --inputs-from . "nixpkgs#runtimeShellPackage^out")/bin/bash" bash tests/entrypoint.sh
          nix build .#default -o image.tar.gz -L
          echo "VERSION=$(nix eval --raw .#default.imageTag)" >> "$GITHUB_ENV"
          # PostgreSQL already links systemd-minimal-libs; the services must add none.
          closure="$(nix path-info -r .#pgbouncer .#postgrest .#pgweb .#s6)"
          if grep systemd <<< "$closure"; then exit 1; fi
      - name: Smoke test
        run: |
          docker load < image.tar.gz
          docker run -d --name smoke --cap-drop=ALL --security-opt=no-new-privileges \
            -e POSTGRES_PASSWORD=smoke-only-at-least-32-characters -e POSTGRES_DB=app -e PGWEB_ENABLED=1 \
            -v "$PWD/tests/initdb:/docker-entrypoint-initdb.d:ro" "postgres-sunday-roast:$VERSION"
          tests/smoke.sh smoke docker
      - name: Service switches and PostgreSQL failure
        run: |
          wait_postgres() {
            for _ in $(seq 90); do
              if docker exec "$1" pg_isready -h 127.0.0.1 -q; then return; fi
              sleep 1
            done
            docker logs "$1"
            return 1
          }
          listening() {
            docker exec "$1" bash -c 'exec 3<>/dev/tcp/127.0.0.1/"$1"' bash "$2" 2>/dev/null
          }
          docker run -d --name defaults -e POSTGRES_PASSWORD=smoke-only "postgres-sunday-roast:$VERSION"
          wait_postgres defaults
          # Wait for the default services before checking the disabled listener.
          for _ in $(seq 60); do
            if listening defaults 6432 && listening defaults 3000; then break; fi
            sleep 1
          done
          listening defaults 6432
          listening defaults 3000
          if listening defaults 8081; then exit 1; fi
          docker logs defaults 2>&1 | grep -F 'PostgREST JWT auth is off'
          # Killing the postmaster must end the whole tree, not restart postgres.
          docker exec defaults bash -c 'read -r pid < "$PGDATA/postmaster.pid"; kill -KILL "$pid"'
          timeout 15 docker wait defaults
          test "$(docker inspect defaults --format '{{.State.Running}}')" = false
          test "$(docker inspect defaults --format '{{.State.ExitCode}}')" != 0
          docker run -d --name disabled --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /run/postgresql:mode=1777 --tmpfs /run/psr-services:exec,mode=1777 --tmpfs /tmp \
            -e POSTGRES_PASSWORD=smoke-only \
            -e PGBOUNCER_ENABLED=false -e POSTGREST_ENABLED=false "postgres-sunday-roast:$VERSION"
          wait_postgres disabled
          for port in 6432 3000 8081; do
            if listening disabled "$port"; then exit 1; fi
          done
          docker stop disabled
          test "$(docker inspect disabled --format '{{.State.ExitCode}}')" = 0
          # Trust permits PostgreSQL without a password, but never pgweb.
          docker run -d --name no-web-password -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e PGWEB_ENABLED=1 "postgres-sunday-roast:$VERSION"
          timeout 15 docker wait no-web-password
          test "$(docker inspect no-web-password --format '{{.State.ExitCode}}')" != 0
          docker logs no-web-password 2>&1 | grep -F 'set PGWEB_AUTH_PASS or POSTGRES_PASSWORD'
      - name: Commands
        run: |
          docker run --rm "postgres-sunday-roast:$VERSION" postgres --version
          docker run --rm "postgres-sunday-roast:$VERSION" psql --version
          # s6 sends postgres SIGINT, so a busy client cannot hold up a stop.
          docker exec -d smoke psql -h /run/postgresql -U postgres -c 'select pg_sleep(600)'
          docker exec -d smoke bash -c 'PGPASSWORD=$POSTGRES_PASSWORD psql "host=127.0.0.1 port=6432 user=postgres dbname=postgres" -c "select pg_sleep(600)"'
          sleep 2
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
      - name: Logs on failure
        if: failure()
        run: |
          for container in smoke defaults disabled no-web-password; do docker logs "$container" || true; done
      - name: Size
        run: |
          docker image inspect "postgres-sunday-roast:$VERSION" --format '{{.Size}}' |
            numfmt --to=iec --suffix=B | sed 's/^/Uncompressed image: /' >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          skopeo() { nix shell --inputs-from . nixpkgs#skopeo -c skopeo "$@"; }
          pinned="$VERSION-${GITHUB_SHA::7}"
          tags=("$pinned")
          # A rerun of an older commit publishes only its pinned tag, so it
          # cannot move 18, latest or the minor tag back.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            tags+=("$VERSION" 18 latest)
          fi
          for t in "${tags[@]}"; do
            skopeo copy --dest-creds "$creds" docker-archive:image.tar.gz "docker://$IMAGE:$t"
          done
          digest="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$pinned")"
          echo "Pushed \`$IMAGE:$pinned@$digest\`" >> "$GITHUB_STEP_SUMMARY"
